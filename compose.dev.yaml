x-dev: &dev
  volumes:
    - .:/app
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    LOG_LEVEL: debug



services:

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  app:
    <<: *dev
    
  scheduler:
    <<: *dev

  queue:
    <<: *dev


