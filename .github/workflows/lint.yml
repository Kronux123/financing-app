name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          npm install

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # resources/js/actions and resources/js/routes are gitignored, so a fresh
      # checkout has neither. Without them the import resolver cannot place an
      # `@/actions` or `@/routes` import and import/order fails on files nobody
      # touched, and types:check fails outright. The tests workflow gets these
      # for free from `npm run build`; this one has to ask.
      - name: Generate Wayfinder Types
        run: php artisan wayfinder:generate

      - name: Check PHP Code Style
        run: composer lint:check

      - name: Check PHP Static Analysis
        run: composer stan

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check

      - name: Check Frontend Types
        run: npm run types:check
