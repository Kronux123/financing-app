<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kept">
    <title>Kept</title>
    <!--
        The app mark on its own ground, for browser tabs and bookmarks.

        Green rather than the app's monochrome primary: a near-black tile
        vanishes on a dark tab strip and a white one vanishes on a light strip,
        while this reads on both. The hue is the goal-met token from app.css,
        the one colour the app already owns, and the state it is built to help
        you reach.

        Note for editors: XML forbids a double hyphen inside a comment, so the
        CSS custom properties cannot be named here in their usual form.
    -->
    <rect width="64" height="64" rx="14" fill="#1baf7a" />
    <g fill="#ffffff">
        <rect x="14" y="30" width="11" height="22" rx="3.5" />
        <rect x="29.5" y="12" width="5" height="40" rx="2.5" />
        <rect x="39" y="20" width="11" height="32" rx="3.5" />
    </g>
</svg>
